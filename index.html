<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LogicLab</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#e2e8f0;font:14px system-ui;overflow:hidden;overscroll-behavior:none}main{height:100dvh;display:flex;flex-direction:column;padding:10px;gap:8px}header{font-size:20px;font-weight:700}nav{display:flex;gap:5px;flex-wrap:wrap}button{background:#243247;color:inherit;border:1px solid #526078;border-radius:8px;padding:10px;touch-action:manipulation}button.on{background:#2563eb}svg{width:100%;flex:1;min-height:0;background:#182334;border-radius:10px;touch-action:none;user-select:none}small{min-height:32px}#result{white-space:pre-wrap;max-height:100px;overflow:auto}</style><main><header>LogicLab <span style="font-size:12px;color:#94a3b8">Sandbox</span></header><nav id="parts"></nav><nav id="modes"></nav><svg id="board"></svg><small id="status"></small><nav><button id="undo">Отмена</button><button id="minus">−</button><button id="plus">+</button><button id="test">Тест</button><button id="clear">Очистить</button></nav><div id="result"></div></main><script>
const $=id=>document.getElementById(id),svg=$('board'),ns='http://www.w3.org/2000/svg';let nodes=[],wires=[],next=1,history=[],mode='move',part='',source=null,drag=null,zoom=1,ox=0,oy=0;try{let s=JSON.parse(localStorage.getItem('logiclab'));if(s){nodes=s.nodes;wires=s.wires;next=s.next}}catch(e){}function persist(){try{localStorage.setItem('logiclab',JSON.stringify({nodes,wires,next}))}catch(e){}}function save(){history.push(JSON.stringify({nodes,wires,next}));$('result').textContent=''}function get(id){return nodes.find(n=>n.id===id)}function count(n){return n.t==='IN'?0:['NOT','OUT'].includes(n.t)?1:2}function val(n,seen=new Set(),over={}){if(!n||seen.has(n.id))return null;if(n.t==='IN')return over[n.id]??n.v;let s=new Set(seen);s.add(n.id);let a=Array.from({length:count(n)},(_,i)=>{let w=wires.find(w=>w.to===n.id&&w.i===i);return w?val(get(w.from),s,over):null});if(a.includes(null))return null;let [x,y]=a;return ({OUT:()=>x,NOT:()=>1-x,AND:()=>x&y,OR:()=>x|y,XOR:()=>x^y,NAND:()=>1-(x&y),NOR:()=>1-(x|y)})[n.t]()}function color(v){return v===1?'#4ade80':v===0?'#94a3b8':'#f59e0b'}function pin(n,i){return {x:n.x+(i==='o'?38:-38),y:n.y+(i==='o'||count(n)===1?0:i===0?-15:15)}}function el(t,a,p){let e=document.createElementNS(ns,t);for(let k in a)e.setAttribute(k,a[k]);p.append(e);return e}function text(p,x,y,t,c='#e2e8f0'){let e=el('text',{x,y,fill:c,'text-anchor':'middle','font-size':13,'pointer-events':'none'},p);e.textContent=t}function pos(e){let r=svg.getBoundingClientRect();return {x:(e.clientX-r.left-ox)/zoom,y:(e.clientY-r.top-oy)/zoom}}function choose(m,p=''){mode=m;part=p;source=null;render()}function render(){svg.replaceChildren();let g=el('g',{transform:`translate(${ox} ${oy}) scale(${zoom})`},svg);document.querySelectorAll('[data-key]').forEach(b=>b.classList.toggle('on',b.dataset.key===(mode==='add'?part:mode)));$('status').textContent=mode==='add'?'Нажми на поле: '+part:mode==='wire'?(source===null?'Выбери правый контакт':'Выбери левый контакт') :mode==='move'?'Перетаскивай компоненты или пустое поле':mode==='run'?'Нажимай на входы':'Нажми элемент или провод';for(let [i,w] of wires.entries()){let a=get(w.from),b=get(w.to);if(!a||!b)continue;let p=pin(a,'o'),q=pin(b,w.i),m=(p.x+q.x)/2,d=`M${p.x} ${p.y} H${m} V${q.y} H${q.x}`;el('path',{d,fill:'none',stroke:color(val(a)),'stroke-width':3},g);let h=el('path',{d,fill:'none',stroke:'transparent','stroke-width':18},g);h.onpointerdown=e=>{if(mode==='delete'){e.stopPropagation();save();wires.splice(i,1);persist();render()}}}for(let n of nodes){let v=val(n),r=el('rect',{x:n.x-29,y:n.y-25,width:58,height:50,rx:8,fill:'#293950',stroke:color(v)},g);text(g,n.x,n.y-5,n.name);text(g,n.x,n.y+14,v??'?',color(v));r.onpointerdown=e=>{e.stopPropagation();if(mode==='move'){save();let p=pos(e);drag={id:n.id,dx:p.x-n.x,dy:p.y-n.y};svg.setPointerCapture(e.pointerId)}else if(mode==='run'&&n.t==='IN'){save();n.v=1-n.v;persist();render()}else if(mode==='delete'){save();nodes=nodes.filter(x=>x!==n);wires=wires.filter(w=>w.from!==n.id&&w.to!==n.id);persist();render()}};for(let i of [...Array(count(n)).keys(),...(n.t==='OUT'?[]:['o'])]){let p=pin(n,i),w=wires.find(w=>w.to===n.id&&w.i===i),c=i==='o'?v:w?val(get(w.from)):null;el('line',{x1:p.x,y1:p.y,x2:n.x+(i==='o'?29:-29),y2:p.y,stroke:color(c),'stroke-width':2},g);el('circle',{cx:p.x,cy:p.y,r:7,fill:i==='o'&&source===n.id?'#60a5fa':color(c)},g);let h=el('circle',{cx:p.x,cy:p.y,r:14,fill:'transparent'},g);h.onpointerdown=e=>{e.stopPropagation();if(mode!=='wire')return;if(i==='o'){source=n.id;render()}else if(source!==null&&source!==n.id){save();wires=wires.filter(w=>!(w.to===n.id&&w.i===i));wires.push({from:source,to:n.id,i});source=null;persist();render()}}}}}svg.onpointerdown=e=>{let p=pos(e);if(mode==='add'){save();let id=next++;nodes.push({id,t:part,x:p.x,y:p.y,v:0,name:part==='IN'?'I'+id:part==='OUT'?'O'+id:part});persist();render()}else if(mode==='move'){drag={pan:true,x:e.clientX-ox,y:e.clientY-oy};svg.setPointerCapture(e.pointerId)}};svg.onpointermove=e=>{if(!drag)return;if(drag.pan){ox=e.clientX-drag.x;oy=e.clientY-drag.y}else{let n=get(drag.id),p=pos(e);if(n){n.x=p.x-drag.dx;n.y=p.y-drag.dy}}render()};svg.onpointerup=svg.onpointercancel=()=>{drag=null;persist()};function button(parent,key,label,fn){let b=document.createElement('button');b.dataset.key=key;b.textContent=label;b.onclick=fn;$(parent).append(b)}for(let t of ['IN','OUT','AND','OR','XOR','NOT','NAND','NOR'])button('parts',t,({IN:'Вход',OUT:'Выход'})[t]||t,()=>choose('add',t));for(let [m,l] of [['move','Двигать'],['wire','Провод'],['run','Сигнал'],['delete','Удалить']])button('modes',m,l,()=>choose(m));$('undo').onclick=()=>{if(history.length){let s=JSON.parse(history.pop());nodes=s.nodes;wires=s.wires;next=s.next;source=null;persist();render()}};$('clear').onclick=()=>{if(confirm('Очистить схему?')){save();nodes=[];wires=[];next=1;source=null;persist();render()}};function scale(k){let r=svg.getBoundingClientRect(),z=Math.max(.35,Math.min(2.5,zoom*k));ox=r.width/2-(r.width/2-ox)*z/zoom;oy=r.height/2-(r.height/2-oy)*z/zoom;zoom=z;render()}$('plus').onclick=()=>scale(1.25);$('minus').onclick=()=>scale(.8);$('test').onclick=()=>{let ins=nodes.filter(n=>n.t==='IN'),outs=nodes.filter(n=>n.t==='OUT');if(ins.length!==2||outs.length!==2){$('result').textContent='Тест полусумматора: нужны 2 входа и 2 выхода (сначала S, затем C).';return}let pass=0,lines=[];for(let a of [0,1])for(let b of [0,1]){let o={[ins[0].id]:a,[ins[1].id]:b},s=val(outs[0],new Set(),o),c=val(outs[1],new Set(),o),ok=s===(a^b)&&c===(a&b);pass+=ok;lines.push(`${a}+${b}: ${c??'?'}${s??'?'} ${ok?'✓':'✗'}`)}$('result').textContent=lines.join(' · ')+' | '+pass+'/4'};render();</script></html>
