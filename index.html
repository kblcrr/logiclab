<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LogicLab</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#e2e8f0;font:14px system-ui;overflow:hidden;overscroll-behavior:none}main{height:100dvh;display:flex;flex-direction:column;padding:10px;gap:8px}header{font-size:20px;font-weight:700}nav{display:flex;gap:5px;flex-wrap:wrap}button{background:#243247;color:inherit;border:1px solid #526078;border-radius:8px;padding:10px;touch-action:manipulation}button.on{background:#2563eb}svg{width:100%;flex:1;min-height:0;background:#182334;border-radius:10px;touch-action:none;user-select:none}small{min-height:32px}#result{white-space:pre-wrap;max-height:100px;overflow:auto}</style><main><header>LogicLab <span style="font-size:12px;color:#94a3b8">1.2 · Sandbox</span></header><nav id="parts"></nav><nav id="modes"></nav><svg id="board"></svg><small id="status"></small><nav><button id="store">Сохранить блок</button><button id="insert">Блоки</button><button id="undo">Отмена</button><button id="minus">−</button><button id="plus">+</button><button id="test">Тест</button><button id="clear">Очистить</button></nav><div id="result"></div></main><script>
const $=id=>document.getElementById(id),svg=$('board'),ns='http://www.w3.org/2000/svg';let nodes=[],wires=[],next=1,history=[],mode='move',part='',source=null,drag=null,zoom=1,ox=0,oy=0;try{let s=JSON.parse(localStorage.getItem('logiclab'));if(s){nodes=s.nodes;wires=s.wires;next=s.next}}catch(e){}function persist(){try{localStorage.setItem('logiclab',JSON.stringify({nodes,wires,next}))}catch(e){}}function save(){history.push(JSON.stringify({nodes,wires,next}));$('result').textContent=''}function get(id){return nodes.find(n=>n.id===id)}function count(n){return isBlock(n)?n.ins.length:n.t==='PORT'?1:n.t==='IN'?0:['NOT','OUT'].includes(n.t)?1:2}let library=[];try{library=JSON.parse(localStorage.getItem('logiclab-blocks')||'[]')}catch(e){};let states={};function isBlock(n){return n.t==='BLOCK'}function outputs(n){return isBlock(n)?n.outs.map((_,i)=>'o'+i):n.t==='OUT'?[]:['o']}function outputId(n,o='o'){return isBlock(n)?n.outs[Number(o.slice(1))]:n.id}function inputId(n,i){return isBlock(n)?n.ins[i]:n.id}function height(n){return isBlock(n)?Math.max(50,Math.max(n.ins.length,n.outs.length)*24+16):50}function solve(over={},seed={}){let v=Object.fromEntries(nodes.filter(n=>!isBlock(n)).map(n=>[n.id,n.t==='IN'?(over[n.id]??n.v):(seed[n.id]??null)]));let seen=new Set();for(let k=0;k<Math.max(64,nodes.length*4);k++){let key=JSON.stringify(v);if(seen.has(key))break;seen.add(key);let next={...v};for(let n of nodes){if(n.t==='IN'||isBlock(n))continue;let [x,y]=Array.from({length:count(n)},(_,i)=>{let w=wires.find(w=>{let b=get(w.to);return b&&inputId(b,w.i)===n.id&&(isBlock(b)||w.i===i)});return w?v[outputId(get(w.from),w.o||'o')]??null:null});let and=x===0||y===0?0:x===1&&y===1?1:null,or=x===1||y===1?1:x===0&&y===0?0:null;next[n.id]=({PORT:()=>x,OUT:()=>x,NOT:()=>x===null?null:1-x,AND:()=>and,OR:()=>or,XOR:()=>x===null||y===null?null:x^y,NAND:()=>and===null?null:1-and,NOR:()=>or===null?null:1-or})[n.t]()}if(JSON.stringify(next)===key)return next;v=next}return Object.fromEntries(nodes.filter(n=>!isBlock(n)).map(n=>[n.id,n.t==='IN'?v[n.id]:null]))}function val(n,seen,over){return n?(over?solve(over)[n.id]:states[n.id])??null:null}function color(v){return v===1?'#4ade80':v===0?'#94a3b8':'#f59e0b'}function pin(n,i){let o=typeof i==='string',k=o?Number(i.slice(1)||0):i,c=o?outputs(n).length:count(n);return {x:n.x+(o?38:-38),y:n.y+(isBlock(n)?(k-(c-1)/2)*24:c===1?0:k===0?-15:15)}}function el(t,a,p){let e=document.createElementNS(ns,t);for(let k in a)e.setAttribute(k,a[k]);p.append(e);return e}function text(p,x,y,t,c='#e2e8f0'){let e=el('text',{x,y,fill:c,'text-anchor':'middle','font-size':13,'pointer-events':'none'},p);e.textContent=t}function pos(e){let r=svg.getBoundingClientRect();return {x:(e.clientX-r.left-ox)/zoom,y:(e.clientY-r.top-oy)/zoom}}function choose(m,p=''){mode=m;part=p;source=null;render()}function render(){states=solve({},states);svg.replaceChildren();let g=el('g',{transform:`translate(${ox} ${oy}) scale(${zoom})`},svg);document.querySelectorAll('[data-key]').forEach(b=>b.classList.toggle('on',b.dataset.key===(mode==='add'?part:mode)));$('status').textContent=mode==='add'?'Нажми на поле: '+part:mode==='wire'?(source===null?'Выбери правый контакт':'Выбери левый контакт') :mode==='move'?'Перетаскивай компоненты или пустое поле':mode==='run'?'Нажимай на входы':'Нажми элемент или провод';for(let [i,w] of wires.entries()){let a=get(w.from),b=get(w.to);if(!a||!b||a.hidden||b.hidden)continue;let p=pin(a,w.o||'o'),q=pin(b,w.i),m=(p.x+q.x)/2,d=`M${p.x} ${p.y} H${m} V${q.y} H${q.x}`;el('path',{d,fill:'none',stroke:color(states[outputId(a,w.o||'o')]),'stroke-width':3},g);let h=el('path',{d,fill:'none',stroke:'transparent','stroke-width':18},g);h.onpointerdown=e=>{if(mode==='delete'){e.stopPropagation();save();wires.splice(i,1);persist();render()}}}for(let n of nodes){if(n.hidden)continue;let v=val(n),r=el('rect',{x:n.x-29,y:n.y-height(n)/2,width:58,height:height(n),rx:8,fill:'#293950',stroke:isBlock(n)?'#60a5fa':color(v)},g);text(g,n.x,n.y-5,n.name);text(g,n.x,n.y+14,isBlock(n)?'BLOCK':v??'?',isBlock(n)?'#60a5fa':color(v));r.onpointerdown=e=>{e.stopPropagation();if(mode==='move'){save();let p=pos(e);drag={id:n.id,dx:p.x-n.x,dy:p.y-n.y};svg.setPointerCapture(e.pointerId)}else if(mode==='run'&&n.t==='IN'){save();n.v=1-n.v;persist();render()}else if(mode==='delete'){save();let ids=new Set([n.id,...(n.members||[])]);nodes=nodes.filter(x=>!ids.has(x.id));wires=wires.filter(w=>!ids.has(w.from)&&!ids.has(w.to));persist();render()}};for(let i of [...Array(count(n)).keys(),...outputs(n)]){let p=pin(n,i),w=wires.find(w=>w.to===n.id&&w.i===i),o=typeof i==='string',c=o?states[outputId(n,i)]:w?states[outputId(get(w.from),w.o||'o')]:null;el('line',{x1:p.x,y1:p.y,x2:n.x+(o?29:-29),y2:p.y,stroke:color(c),'stroke-width':2},g);el('circle',{cx:p.x,cy:p.y,r:7,fill:o&&source?.id===n.id&&source?.o===i?'#60a5fa':color(c)},g);let h=el('circle',{cx:p.x,cy:p.y,r:14,fill:'transparent'},g);h.onpointerdown=e=>{e.stopPropagation();if(mode!=='wire')return;if(o){source={id:n.id,o:i};render()}else if(source!==null&&source.id!==n.id){save();wires=wires.filter(w=>!(w.to===n.id&&w.i===i));wires.push({from:source.id,o:source.o,to:n.id,i});states={};source=null;persist();render()}}}}}svg.onpointerdown=e=>{let p=pos(e);if(mode==='add'){save();if(part.startsWith('block:')){placeBlock(library[Number(part.slice(6))],p);persist();render();return}let id=next++;nodes.push({id,t:part,x:p.x,y:p.y,v:0,name:part==='IN'?'I'+id:part==='OUT'?'O'+id:part});persist();render()}else if(mode==='move'){drag={pan:true,x:e.clientX-ox,y:e.clientY-oy};svg.setPointerCapture(e.pointerId)}};svg.onpointermove=e=>{if(!drag)return;if(drag.pan){ox=e.clientX-drag.x;oy=e.clientY-drag.y}else{let n=get(drag.id),p=pos(e);if(n){n.x=p.x-drag.dx;n.y=p.y-drag.dy}}render()};svg.onpointerup=svg.onpointercancel=()=>{drag=null;persist()};function button(parent,key,label,fn){let b=document.createElement('button');b.dataset.key=key;b.textContent=label;b.onclick=fn;$(parent).append(b)}for(let t of ['IN','OUT','AND','OR','XOR','NOT','NAND','NOR'])button('parts',t,({IN:'Вход',OUT:'Выход'})[t]||t,()=>choose('add',t));for(let [m,l] of [['move','Двигать'],['wire','Провод'],['run','Сигнал'],['delete','Удалить']])button('modes',m,l,()=>choose(m));$('undo').onclick=()=>{if(history.length){let s=JSON.parse(history.pop());nodes=s.nodes;wires=s.wires;next=s.next;states={};source=null;persist();render()}};$('clear').onclick=()=>{if(confirm('Очистить схему?')){save();nodes=[];wires=[];states={};next=1;source=null;persist();render()}};function scale(k){let r=svg.getBoundingClientRect(),z=Math.max(.35,Math.min(2.5,zoom*k));ox=r.width/2-(r.width/2-ox)*z/zoom;oy=r.height/2-(r.height/2-oy)*z/zoom;zoom=z;render()}$('plus').onclick=()=>scale(1.25);$('minus').onclick=()=>scale(.8);$('test').onclick=()=>{let ins=nodes.filter(n=>n.t==='IN'&&!n.hidden),outs=nodes.filter(n=>n.t==='OUT'&&!n.hidden);if(ins.length!==2||outs.length!==2){$('result').textContent='Тест полусумматора: нужны 2 входа и 2 выхода (сначала S, затем C).';return}let pass=0,lines=[];for(let a of [0,1])for(let b of [0,1]){let o={[ins[0].id]:a,[ins[1].id]:b},s=val(outs[0],new Set(),o),c=val(outs[1],new Set(),o),ok=s===(a^b)&&c===(a&b);pass+=ok;lines.push(`${a}+${b}: ${c??'?'}${s??'?'} ${ok?'✓':'✗'}`)}$('result').textContent=lines.join(' · ')+' | '+pass+'/4'} ;function placeBlock(b,p){if(!b)return;let id=next++,map=new Map(b.nodes.map(n=>[n.id,next++]));let members=b.nodes.map(n=>map.get(n.id));for(let n of b.nodes){let c={...n,id:map.get(n.id),hidden:true};if(n.t==='IN')c.t='PORT';if(n.t==='BLOCK'){c.ins=n.ins.map(x=>map.get(x));c.outs=n.outs.map(x=>map.get(x));c.members=n.members.map(x=>map.get(x))}nodes.push(c)}for(let w of b.wires)wires.push({...w,from:map.get(w.from),to:map.get(w.to)});nodes.push({id,t:'BLOCK',name:b.name,x:p.x,y:p.y,ins:b.ins.map(x=>map.get(x)),outs:b.outs.map(x=>map.get(x)),members})} $('store').onclick=()=>{let ins=nodes.filter(n=>!n.hidden&&n.t==='IN').sort((a,b)=>a.y-b.y),outs=nodes.filter(n=>!n.hidden&&n.t==='OUT').sort((a,b)=>a.y-b.y);if(!ins.length||!outs.length){alert('Нужны внешние входы и выходы');return}let name=prompt('Название блока (входы и выходы сверху вниз)','D-Latch');if(!name?.trim())return;library.push(JSON.parse(JSON.stringify({name:name.trim().slice(0,12),nodes,wires,ins:ins.map(n=>n.id),outs:outs.map(n=>n.id)})));localStorage.setItem('logiclab-blocks',JSON.stringify(library));alert('Блок сохранён. Можно очистить поле и вставить копии через Блоки.')};$('insert').onclick=()=>{if(!library.length){alert('Сначала сохрани схему как блок');return}let k=prompt(library.map((b,i)=>`${i+1}: ${b.name}`).join('\n')+'\nНомер блока','1');if(k!==null&&library[Number(k)-1])choose('add','block:'+(Number(k)-1))};render();</script></html>
